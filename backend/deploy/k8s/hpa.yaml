# v1.1 扩容策略修订：
# - 单Pod容量按消息吞吐重估为2000连接（gobwas/ws 0.5KB/连接，内存非瓶颈）
# - HPA仅负责日内波动；时段性高峰由 cronhpa.yaml 定时扩容承担
# - 缩容配合 deployment.yaml 的 preStop 优雅驱逐（30s连接驱逐期）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: signal-gateway-hpa
  namespace: harmonycanvas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: signal-gateway
  minReplicas: 2
  maxReplicas: 50   # 50×2000=10万连接理论上限；万人并发仅需5 Pod
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: ws_connections_per_pod
      target:
        type: AverageValue
        averageValue: "2000"   # v1.1: 200→2000，与容量重估一致
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
