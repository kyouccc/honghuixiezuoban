apiVersion: v1
kind: Service
metadata:
  name: signal-gateway
  namespace: harmonycanvas
spec:
  type: LoadBalancer
  selector:
    app: signal-gateway
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: ws
    port: 443
    targetPort: 8081
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
