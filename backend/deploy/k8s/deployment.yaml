apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-gateway
  namespace: harmonycanvas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signal-gateway
  template:
    metadata:
      labels:
        app: signal-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: signal-gateway
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
      - name: signal-gateway
        image: swr.cn-north-4.myhuaweicloud.com/harmonycanvas/signal-gateway:v1.0.0
        ports:
        - name: http
          containerPort: 8080
        - name: ws
          containerPort: 8081
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: harmonycanvas-config
              key: redis.addr
        - name: LOG_LEVEL
          value: "info"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          failureThreshold: 30
          periodSeconds: 5
        lifecycle:
          # v1.1 优雅驱逐：30秒连接驱逐期，消除缩容断连风暴
          # ① /drain 端点：从负载摘除+向存量客户端下发REBALANCE通知主动重连
          # ② 等待存量消息排空（最长25s）后退出
          preStop:
            exec:
              command: ["/bin/sh", "-c", "wget -q -O- http://localhost:8080/drain || true; sleep 25"]
